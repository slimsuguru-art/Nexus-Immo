<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mon espace bailleur — KAZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bailleur-page">
  <header class="site-header">
    <a class="brand" href="index.html">KAZA</a>
    <nav class="nav">
      <a href="index.html">Logements</a>
      <a href="messagerie.html">Messages</a>
      <button id="logoutBtn" class="btn btn-ghost">Déconnexion</button>
    </nav>
  </header>

  <main class="section">
    <div class="section-head">
      <div>
        <span class="eyebrow">Mon espace bailleur</span>
        <h1 id="welcome">Bonjour</h1>
      </div>
      <a class="btn btn-primary" href="publish.html">+ Publier</a>
    </div>

    <div id="stats" class="stats-grid"></div>

    <section class="insights-grid">
      <div class="chart-card">
        <span class="eyebrow">Revenu locatif estimé</span>
        <h3 id="revenueTotal">—</h3>
        <div id="revenueChart"></div>
      </div>
      <div class="ring-card">
        <span class="eyebrow">Taux d'occupation</span>
        <div id="occupancyRing"></div>
      </div>
      <div class="upcoming-card">
        <span class="eyebrow">Échéances à venir</span>
        <div id="upcomingList"></div>
      </div>
    </section>

    <div class="section-head">
      <div>
        <span class="eyebrow">Annonces</span>
        <h2>Mes logements</h2>
      </div>
    </div>
    <div id="dashboardContent" class="property-grid"></div>

    <section class="contrats-section">
      <div class="section-head">
        <div>
          <span class="eyebrow">Suivi</span>
          <h2>Contrats en cours</h2>
        </div>
      </div>
      <div id="contratsList" class="contrats-list"></div>
    </section>
  </main>

  <script type="module" src="js/dashboard-bailleur.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script src="js/pwa.js"></script>
</body>

</html>
