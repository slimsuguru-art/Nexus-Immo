<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publier — KAZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header"><a class="brand" href="index.html">KAZA</a>
    <nav class="nav"><a href="index.html">Logements</a><a href="dashboard.html">Mon espace</a></nav>
  </header>
  <main class="section narrow"><span class="eyebrow">Bailleur</span>
    <h1 id="publishTitle">Publier un logement</h1>
    <form id="publishForm" class="form-card"><label>Titre<input id="title" required></label><label>Description<textarea id="description" rows="5"
          required></textarea></label>
      <div class="form-grid"><label>Type<select id="type">
            <option>Appartement</option>
            <option>Studio</option>
            <option>Villa</option>
            <option>Maison</option>
          </select></label><label>Prix mensuel<input id="price" type="number" min="0" required></label><label>Ville<select id="city" required></select></label><label>Quartier<select
            id="district" required></select></label><label>Pièces<input id="rooms" type="number" min="1"
            required></label></div>
      <label class="upload-field" for="imageFile">Photo du logement
        <input id="imageFile" type="file" accept="image/*" hidden>
        <div id="uploadPreview" class="upload-dropzone">
          <svg viewBox="0 0 24 24">
            <path d="M4 17V6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
          <span>Ajouter une photo réelle du logement</span>
          <small>JPG ou PNG, 5 Mo max</small>
        </div>
      </label>
      <button class="btn btn-primary">Publier l'annonce</button>
      <div id="publishMessage" class="form-message"></div>
    </form>
  </main>
  <script type="module" src="js/properties.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script src="js/pwa.js"></script>
</body>

</html>
