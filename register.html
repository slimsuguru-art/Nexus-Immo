<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — KAZA</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html">KAZA</a><h1>Créer votre compte</h1><p>Choisissez votre profil.</p><form id="registerForm" class="form-stack"><label>Nom complet<input id="registerName" required></label><label>Email<input id="registerEmail" type="email" required></label><label>Profil<select id="registerRole"><option value="locataire">Locataire</option><option value="bailleur">Bailleur</option></select></label><label>Mot de passe<input id="registerPassword" type="password" minlength="6" required></label><button class="btn btn-primary">Créer mon compte</button><div id="registerMessage" class="form-message"></div></form><p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p></main><script type="module" src="js/auth.js"></script></body></html>
