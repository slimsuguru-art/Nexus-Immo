<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inscription — KAZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-grid"></div>
    <div class="auth-scan"></div><svg class="auth-shape auth-shape--house" viewBox="0 0 64 64">
      <path d="M8 30 32 10 56 30" />
      <path d="M14 28v26h36V28" />
      <path d="M26 54V38h12v16" />
    </svg><svg class="auth-shape auth-shape--key" viewBox="0 0 64 64">
      <circle cx="20" cy="20" r="10" />
      <path d="M27 27 54 54" />
      <path d="M46 46l6-6" />
      <path d="M38 38l6-6" />
    </svg><svg class="auth-shape auth-shape--plan" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" />
      <line x1="8" y1="32" x2="56" y2="32" />
      <line x1="32" y1="8" x2="32" y2="32" />
    </svg>
  </div>
  <main class="auth-card">
    <div class="auth-card-head">
      <a class="brand" href="index.html">KAZA</a>
      <span class="auth-kicker">Créer un compte</span>
      <h1>Créer votre compte</h1>
      <p>Choisissez votre profil.</p>
    </div>
    <form id="registerForm" class="form-stack">
      <label>Nom complet<input id="registerName" required></label>
      <label>Email<input id="registerEmail" type="email" required></label>
      <label>Profil
        <select id="registerRole">
          <option value="locataire">Locataire</option>
          <option value="bailleur">Bailleur</option>
        </select>
      </label>
      <label>Mot de passe<input id="registerPassword" type="password" minlength="6" required></label>
      <button class="btn btn-primary">Créer mon compte</button>
      <div id="registerMessage" class="form-message"></div>
    </form>
    <p class="auth-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>

</html>
